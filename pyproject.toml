[project]
name = "medford"
version = "2.1.0"
authors = [
  {name = "redacted", email = "redacted@redacted.com"},
]
description = "The MEDFORD Parser command line tool for vaidating & compiling medford research metadata files."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11.7",
]

[project.urls]
Repository = "https://anonymous.4open.science/r/medford-20C6/"

[project.scripts]
medford = "MEDFORD:parse_args_and_go"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
]

[tool.pytest.ini_options]
pythonpath = "src"
